# AI 每日前沿 —— 来源清单
#
# 字段说明：
#   id        稳定标识，不要随意更改（影响去重与已读状态）
#   name      显示名称
#   category  lab（公司/实验室） | paper（论文） | cn-media（中文媒体）
#   lang      en | zh
#   type      rss | json | html
#   url       抓取地址
#   homepage  原文首页
#   enabled   设为 false 可临时停用
#
# 本清单经 2026-10-04 实测筛选，详见 docs/source-availability-2026-10-04.md

# AI 相关关键词：用于把综合科技媒体、以及内容较杂的实验室博客里的 AI 内容筛出来。
# 各来源通过 filter_keywords: *ai_keywords 引用这份列表。
ai_keywords: &ai_keywords
  - "AI"
  - "人工智能"
  - "大模型"
  - "智能体"
  - "Agent"
  - "机器学习"
  - "深度学习"
  - "神经网络"
  - "算力"
  - "多模态"
  - "AIGC"
  - "生成式"
  - "GPT"
  - "LLM"
  - "Transformer"
  - "ChatGPT"
  - "Claude"
  - "Gemini"
  - "Copilot"
  - "DeepSeek"
  - "OpenAI"
  - "Anthropic"
  - "语言模型"
  - "language model"
  - "diffusion"
  - "embedding"
  - "reasoning"
  - "alignment"
  - "benchmark"
  - "inference"
  - "fine-tun"
  - "模型"
  - "推理"
  - "开源模型"
  - "文生图"
  - "文生视频"
  - "芯片"
  - "机器人"
  - "自动驾驶"

sources:
  # ===== A 类：全球 AI 公司 / 实验室（英文） =====
  - id: openai
    name: OpenAI
    category: lab
    lang: en
