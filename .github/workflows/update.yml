# 每天自动抓取并发布到 GitHub Pages
#
# 时间：UTC 00:00 / 05:00 / 12:00
#       = 北京时间 08:00 / 13:00 / 20:00（中国无夏令时，全年固定）
# 也支持在 Actions 页面手动点 "Run workflow" 立即更新一次。

name: 更新 AI 每日前沿

on:
  schedule:
    - cron: "0 0,5,12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "sources.yaml"
      - "tools/**"
      - ".github/workflows/update.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-daily-feed
  cancel-in-progress: false

env:
  # 上一版数据地址，用于合并（第一次跑时文件还不存在，程序会自行忽略）
  PREV_FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 跑单元测试
        run: python -m pytest tests -q

      - name: 抓取并生成数据
        run: python -m src.build_feed --out data/feed.json --previous "$PREV_FEED_URL"

      - name: 组装静态站点
        run: python tools/build_site.py

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4